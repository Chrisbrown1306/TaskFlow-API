<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --border:    #1e2d45;
      --accent:    #3b82f6;
      --accent-h:  #2563eb;
      --green:     #22c55e;
      --red:       #ef4444;
      --text:      #f1f5f9;
      --muted:     #64748b;
      --radius:    12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(99,102,241,.08), transparent);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,.5);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 1.2rem;
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.8rem;
    }
    .tab {
      flex: 1; padding: .55rem;
      text-align: center; font-size: .875rem; font-weight: 500;
      border-radius: 8px; cursor: pointer;
      color: var(--muted); border: none; background: none;
      transition: all .2s;
    }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 6px rgba(0,0,0,.4); }

    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: .45rem; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; padding: .75rem 1rem;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: .95rem; font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    input::placeholder { color: var(--muted); }
    input.error { border-color: var(--red); }

    .field-error { font-size: .78rem; color: var(--red); margin-top: .35rem; display: none; }
    .field-error.show { display: block; }

    .btn {
      width: 100%; padding: .85rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 1rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif;
      cursor: pointer; margin-top: .5rem;
      transition: background .2s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn:hover  { background: var(--accent-h); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .alert {
      padding: .85rem 1rem; border-radius: var(--radius);
      font-size: .875rem; margin-bottom: 1.2rem;
      display: none; align-items: flex-start; gap: .6rem;
    }
    .alert.show { display: flex; }
    .alert.success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #4ade80; }
    .alert.error   { background: rgba(239,68,68,.1);  border: 1px solid rgba(239,68,68,.3);  color: #f87171; }

    .demo-creds {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(59,130,246,.06);
      border: 1px solid rgba(59,130,246,.2);
      border-radius: var(--radius);
      font-size: .8rem; color: var(--muted);
    }
    .demo-creds strong { color: var(--text); display: block; margin-bottom: .5rem; }
    .demo-creds code { color: var(--accent); font-family: monospace; }
    .demo-btn { background: none; border: none; color: var(--accent); font-size: .78rem; cursor: pointer; padding: .2rem 0; text-decoration: underline; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .btn.loading .spinner { display: block; }
    .btn.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✓</div>
      <span class="logo-text">TaskFlow</span>
    </div>

    <div id="alert" class="alert">
      <span id="alertIcon">⚠</span>
      <span id="alertMsg"></span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div id="loginPanel" class="panel active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
        <div class="field-error" id="loginEmailErr"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
        <div class="field-error" id="loginPasswordErr"></div>
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>
    </div>

    <!-- REGISTER -->
    <div id="registerPanel" class="panel">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Jane Doe" />
        <div class="field-error" id="regNameErr"></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
        <div class="field-error" id="regEmailErr"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 8 chars, upper, lower, number, symbol" />
        <div class="field-error" id="regPasswordErr"></div>
      </div>
      <button class="btn" id="regBtn" onclick="handleRegister()">
        <span class="btn-text">Create Account</span>
        <div class="spinner"></div>
      </button>
    </div>

    <div class="demo-creds">
      <strong>🔑 Demo Credentials</strong>
      Admin: <code>admin@taskflow.dev</code> / <code>Admin@1234</code>
      <button class="demo-btn" onclick="fillDemo('admin')">Fill →</button><br/>
      User: <code>demo@taskflow.dev</code> / <code>Demo@1234</code>
      <button class="demo-btn" onclick="fillDemo('demo')">Fill →</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
